# Running inside the Compose stack: the database is the "postgres" service.
# DB_PASSWORD has no default on purpose: startup fails naming it if it is missing.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/${DB_NAME:pokedex}}
    username: ${DB_USERNAME:pokedex}
    password: ${DB_PASSWORD}

server:
  # Fixed inside the container; compose publishes it on ${SERVER_PORT:-8080}.
  port: 8080
