# gitleaks configuration: the default rules, plus one narrowly scoped exception.
title = "pokedex"

[extend]
useDefault = true

[[allowlists]]
description = "Test-only HMAC signing secrets in the generated GenAI sample's tests (backend/docs/GENAI.md); not real credentials. The first path is where they live in the history imported from pokedex-api."
condition = "AND"
paths = ['''^docs/genai-sample/src/test/''', '''^backend/docs/genai-sample/src/test/''']
regexTarget = "match"
regexes = [
  '''test-secret-that-is-at-least-32-bytes-long''',
  '''integration-test-secret-of-at-least-32-bytes''',
]
