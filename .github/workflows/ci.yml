# One pipeline for both apps: every job runs on every push to main and every pull request, so a change
# in one app is checked against the other (the end-to-end job builds both from the same commit).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: "Backend: build and test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify (compile -Werror, unit + slice + Testcontainers tests, ArchUnit, coverage gate, format)
        run: ./mvnw -B -ntp verify
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Backend coverage"
            ./scripts/coverage-summary.sh || echo "Coverage report not produced."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  genai-sample:
    name: "Backend: GenAI sample"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/docs/genai-sample/pom.xml
      - name: Verify the generated Task API (backend/docs/genai-sample, its own pom.xml, Testcontainers)
        run: ./mvnw -B -ntp -f docs/genai-sample/pom.xml verify

  frontend:
    name: "Frontend: lint, type-check, test, build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (zero warnings)
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type-check (strict)
        run: npm run typecheck
      - name: Tests with coverage gate (console output fails a test)
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  images:
    name: "Image: ${{ matrix.app }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            tag: pokedex-api:ci
          - app: frontend
            tag: pokedex-web:ci
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Local placeholders for the stack
        run: cp .env.example .env
      - name: Journeys and accessibility against a fresh full stack built from this commit
        run: frontend/scripts/e2e.sh
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  openspec:
    name: Validate specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: openspec validate --all --strict
        env:
          OPENSPEC_TELEMETRY: "0"
        run: npx --yes @fission-ai/openspec@1.14.1 validate --all --strict --no-interactive

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history, with the root .gitleaks.toml)
        run: >-
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1
