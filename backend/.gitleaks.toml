# gitleaks configuration: the default rules, plus one narrowly scoped exception.
title = "pokedex-api"

[extend]
useDefault = true

[[allowlists]]
description = "Test-only HMAC signing secrets in the generated GenAI sample's tests (docs/GENAI.md); not real credentials"
condition = "AND"
paths = ['''^docs/genai-sample/src/test/''']
regexTarget = "match"
regexes = [
  '''test-secret-that-is-at-least-32-bytes-long''',
  '''integration-test-secret-of-at-least-32-bytes''',
]
