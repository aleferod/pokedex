# Automated tests: the datasource comes from Testcontainers (@ServiceConnection).
spring:
  main:
    banner-mode: off

app:
  security:
    jwt:
      # Test-only value (>= 32 bytes); never used outside automated tests.
      secret: test-only-signing-secret-do-not-use-in-any-real-environment
    password:
      # Minimum BCrypt cost keeps the suite fast; production uses 10+.
      bcrypt-strength: 4
  pokeapi:
    retry:
      # Same policy, shorter waits: keeps the failure tests fast.
      initial-backoff: 10ms
    circuit-breaker:
      # Each integration-test context shares one breaker; only PokeApiResilienceIT trips it.
      minimum-calls: 100
      sliding-window: 100
